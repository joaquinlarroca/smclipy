[project]
name = "smclipy"
version = "0.2.0"
description = "Simple music CLI to download, tag, and organize music from YouTube and SoundCloud"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "climage>=0.2.2",
    "mutagen>=1.47.0",
    "pillow>=12.2.0",
    "prompt-toolkit>=3.0.52",
    "yt-dlp[default]>=2026.3.17",
]

[project.scripts]
smclipy = "smclipy.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["smclipy"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["smclipy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "climage.*"]
ignore_missing_imports = true
