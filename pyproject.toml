[project]
name = "smclipy"
version = "0.2.0"
description = "Simple music CLI to download, tag, and organize music from YouTube and SoundCloud"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "climage>=0.2.2",
    "mutagen>=1.47.0",
    "pillow>=12.2.0",
    "prompt-toolkit>=3.0.52",
    "yt-dlp[default]>=2026.3.17",
]

[project.scripts]
smclipy = "smclipy.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["smclipy"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["smclipy", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["smclipy", "smclipy.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "climage.*", "mutagen.*"]
ignore_missing_imports = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
no_implicit_reexport = false
strict_equality = false
warn_return_any = false
warn_unused_ignores = false
